async function ai(prompt,sys){
  const r=await fetch('https://hipctdxrnsawhanuuojt.supabase.co/functions/v1/quick-worker',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:sys||'You are a professional personal trainer.',messages:[{role:'user',content:prompt}]})});
  const d=await r.json();return d.content?.[0]?.text||'';
}

function Auth({onAuth,lang,setLang}){

  const[email,setEmail]=useState('');const[pass,setPass]=useState('');const[name,setName]=useState('');
  const[loading,setLoading]=useState(false);const[err,setErr]=useState('');
  const t=T[lang];
  async function go(){
    setErr('');setLoading(true);
    try{
      if(mode==='login'){const{data,error:e}=await sb.auth.signInWithPassword({email,password:pass});if(e)throw e;onAuth(data.user);}
      else{const{data,error:e}=await sb.auth.signUp({email,password:pass,options:{data:{name}}});if(e)throw e;if(data.user)onAuth(data.user);}
    }catch(e){setErr(e.message);}
    setLoading(false);
  }
  return(
    <div className="aw">
      <div className="ac">

          <div className="lt">{['es','en'].map(l=><button key={l} className={`lb${lang===l?' active':''}`} onClick={()=>setLang(l)}>{l.toUpperCase()}</button>)}</div>

        {err&&<div className="err">{err}</div>}

        <div><label>{t.password}</label><input type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==='Enter'&&go()} autoComplete="current-password"/></div>

function Profile({user,profile,onSave,lang,t}){
  const[f,setF]=useState({name:profile?.name||user.user_metadata?.name||'',age:profile?.age||'',weight:profile?.weight||'',height:profile?.height||'',sex:profile?.sex||'male',goal:profile?.goal||t.goals[0],level:profile?.level||t.levels[0],days:profile?.days||3,injuries:profile?.injuries||''});
  const[loading,setLoading]=useState(false);const[saved,setSaved]=useState(false);
  const s=k=>v=>setF(f=>({...f,[k]:v}));
  async function save(){setLoading(true);await sb.from('gymbro_profiles').upsert({user_id:user.id,...f,lang,updated_at:new Date().toISOString()});setSaved(true);setTimeout(()=>setSaved(false),2000);onSave(f);setLoading(false);}

    <div className="pg">

        <div className="row"><div><label>{t.weight}</label><input type="number" value={f.weight} onChange={e=>s('weight')(e.target.value)}/></div><div><label>{t.height}</label><input type="number" value={f.height} onChange={e=>s('height')(e.target.value)}/></div></div>
        <div className="row">

        </div>

function Gym({user,gymData,onSave,lang,t}){
  const ME=lang==='en'?MEN:MES;

function Routine({user,profile,gymData,routine,setRoutine,lang,t}){
  const[gen,setGen]=useState(false);const[exp,setExp]=useState(null);const[demo,setDemo]=useState(null);const[demoL,setDemoL]=useState(false);const[demoT,setDemoT]=useState('');
  async function generate(){

    const mach=(gymData.machines||[]).join(', ')||'basic equipment';
    const p=lang==='es'
      ?`Crea rutina semanal ${profile.days} días para: ${profile.age} años, ${profile.sex==='male'?'hombre':'mujer'}, ${profile.weight}kg, ${profile.height}cm. Objetivo: ${profile.goal}. Nivel: ${profile.level}. Lesiones: ${profile.injuries||'ninguna'}. Equipamiento disponible: ${mach}.\nResponde SOLO con JSON válido sin markdown ni texto extra:\n{"days":[{"day":"Lunes","muscles":"Pecho + Tríceps","exercises":[{"name":"Press banca","sets":4,"reps":"8-10","rest":"90s","notes":"Agarre medio"}]}]}`

    try{
      const txt=await ai(p);
      const clean=txt.replace(/```json|```/g,'').trim();
      const data=JSON.parse(clean);
      await sb.from('gymbro_routines').upsert({user_id:user.id,routine:data,created_at:new Date().toISOString()});
      setRoutine(data);
      localStorage.setItem('gr_'+user.id,JSON.stringify(data));
    }catch(e){console.error(e);}
    setGen(false);
  }
  async function showDemo(name){
    setDemo(name);setDemoL(true);setDemoT('');

          <div style={{fontSize:'3rem',marginBottom:'1rem'}}>💪</div>

        </div>
      ):(
        <>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>
            <div style={{fontFamily:'Bebas Neue',fontSize:'1.4rem',letterSpacing:'3px',color:'var(--g)'}}>{t.yourRoutine}</div>
            <button className="btn bto bsm" onClick={generate} disabled={gen}>{gen?<span className="sp"/>:'↻ IA'}</button>
          </div>
          {days.map((day,i)=>(
            <div key={i} className="dc">
              <div className="dh" onClick={()=>setExp(exp===i?null:i)}>
                <div><div className="dn">{day.day}</div><div className="dm">{day.muscles}</div></div>
                <span className={`cv${exp===i?' open':''}`}>▾</span>
              </div>
              {exp===i&&(
                <div className="db">
                  {(day.exercises||[]).map((ex,j)=>(
                    <div key={j} className="ex">
                      <div className="en">{ex.name}</div>
                      <div className="ed">
                        <span className="tag">{ex.sets} {t.sets}</span>
                        <span className="tag">{ex.reps} {t.reps}</span>
                        <span className="tag">{ex.rest}</span>
                      </div>
                      {ex.notes&&<div style={{fontSize:'.74rem',color:'var(--m)',marginTop:'.2rem'}}>{ex.notes}</div>}
                      <div className="ea">
                        <button className="btn bto bsm" onClick={()=>demo===ex.name?setDemo(null):showDemo(ex.name)}>
                          {demo===ex.name?t.close:t.demo}
                        </button>
                      </div>
                      {demo===ex.name&&(
                        <div className="dp">
                          <div style={{fontFamily:'Bebas Neue',letterSpacing:'2px',color:'var(--g)',marginBottom:'.5rem'}}>{t.demoTitle}: {ex.name}</div>
                          {demoL
                            ?<div className="lc"><span className="sp"/><span style={{fontSize:'.82rem'}}>{t.loadingDemo}</span></div>
                            :<p style={{fontSize:'.83rem',lineHeight:'1.65',color:'#ccc',whiteSpace:'pre-wrap'}}>{demoT}</p>
                          }
                          <iframe src={`https://www.youtube.com/embed?search=${encodeURIComponent(ex.name+' proper form tutorial')}&listType=search`} allowFullScreen title={ex.name}/>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}
        </>
      )}
    </div>
  );
}

function Session({user,routine,lang,t}){
  const todayIdx=(new Date().getDay()+6)%7;
  const days=routine?.days||[];
  const tod=days[Math.min(todayIdx,days.length-1)]||days[0];
  const[chk,setChk]=useState({});const[notes,setNotes]=useState({});const[an,setAn]=useState(null);
  const[saving,setSaving]=useState(false);const[saved,setSaved]=useState(false);
  const togS=(ei,si)=>{const k=`${ei}-${si}`;setChk(c=>({...c,[k]:!c[k]}));};
  async function saveS(){
    setSaving(true);
    await sb.from('gymbro_sessions').insert({user_id:user.id,day:tod?.day,date:new Date().toISOString(),checked:chk,notes});
    setSaved(true);setSaving(false);setTimeout(()=>setSaved(false),2500);
  }
  if(!routine)return<div className="pg"><div className="card" style={{textAlign:'center',padding:'2rem',color:'var(--m)'}}>{t.noRoutine}</div></div>;
  const exs=tod?.exercises||[];
  const total=exs.reduce((a,e)=>a+(e.sets||0),0);
  const done=Object.values(chk).filter(Boolean).length;
  return(
    <div className="pg">
      <div className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div><div className="ct" style={{marginBottom:'.2rem'}}>{tod?.day}</div><div style={{fontSize:'.82rem',color:'var(--m)'}}>{tod?.muscles}</div></div>
          <span className="bg">{done}/{total}</span>
        </div>
        <div className="pb"><div className="pf" style={{width:`${total?done/total*100:0}%`}}/></div>
      </div>
      {exs.map((ex,i)=>(
        <div key={i} className="card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.6rem'}}>
            <div><div style={{fontWeight:500,fontSize:'.92rem'}}>{ex.name}</div><div style={{fontSize:'.75rem',color:'var(--m)'}}>{ex.sets}×{ex.reps} · {ex.rest}</div></div>
            <button className="btn bto bsm" onClick={()=>setAn(an===i?null:i)}>📝</button>
          </div>
          {Array.from({length:ex.sets||0}).map((_,s)=>{
            const k=`${i}-${s}`;
            return(
              <div key={s} className="sr">
                <div className={`sc${chk[k]?' done':''}`} onClick={()=>togS(i,s)}>{chk[k]&&'✓'}</div>
                <span style={{fontSize:'.82rem',color:'var(--m)'}}>Set {s+1} · {ex.reps}</span>
              </div>
            );
          })}
          {an===i&&(
            <textarea style={{width:'100%',background:'#1e1e1e',border:'1px solid #2a2a2a',borderRadius:'8px',padding:'.6rem',color:'#f0f0f0',fontFamily:'DM Sans',fontSize:'.82rem',minHeight:'65px',resize:'vertical',marginTop:'.6rem',outline:'none'}}
              placeholder={t.addNotes} value={notes[i]||''} onChange={e=>setNotes(n=>({...n,[i]:e.target.value}))}/>
          )}
        </div>
      ))}
      {saved&&<div className="ok">{t.sessionSaved}</div>}
      <button className="btn" onClick={saveS} disabled={saving}>{saving?<><span className="sp"/> {t.saving}</>:t.done}</button>
    </div>
  );
}

function History({user,lang,t}){
  const[sess,setSess]=useState([]);const[loading,setLoading]=useState(true);
  useEffect(()=>{
    sb.from('gymbro_sessions').select('*').eq('user_id',user.id).order('date',{ascending:false}).limit(30)
      .then(({data})=>{setSess(data||[]);setLoading(false);});
  },[user.id]);
  if(loading)return<div className="lc"><span className="sp"/></div>;
  return(
    <div className="pg">
      {sess.length===0
        ?<div className="card" style={{textAlign:'center',padding:'2rem',color:'var(--m)'}}>{t.noHistory}</div>
        :sess.map((s,i)=>(
          <div key={i} className="card">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{fontFamily:'Bebas Neue',fontSize:'1.05rem',letterSpacing:'2px'}}>{s.day}</div>
              <span style={{fontSize:'.76rem',color:'var(--m)'}}>{new Date(s.date).toLocaleDateString(lang==='es'?'es-ES':'en-GB')}</span>
            </div>
            <div style={{fontSize:'.76rem',color:'var(--m)',marginTop:'.2rem'}}>{Object.values(s.checked||{}).filter(Boolean).length} sets completados</div>
            {Object.values(s.notes||{}).some(n=>n)&&(
              <div style={{fontSize:'.75rem',color:'#555',marginTop:'.3rem',fontStyle:'italic'}}>{Object.values(s.notes).filter(Boolean).slice(0,2).join(' · ')}</div>
            )}
          </div>
        ))
      }
    </div>
  );
}

function Admin({user,t}){
  const[pend,setPend]=useState([]);const[loading,setLoading]=useState(true);
  useEffect(()=>{
    sb.from('gymbro_device_requests').select('*').eq('status','pending')
      .then(({data})=>{setPend(data||[]);setLoading(false);});
  },[]);
  async function dec(id,st){await sb.from('gymbro_device_requests').update({status:st}).eq('id',id);setPend(p=>p.filter(x=>x.id!==id));}
  if(loading)return<div className="lc"><span className="sp"/></div>;
  return(
    <div className="pg">
      <div style={{fontFamily:'Bebas Neue',fontSize:'1.4rem',letterSpacing:'3px',color:'var(--g)',marginBottom:'1rem'}}>{t.pendingDevices}</div>
      {pend.length===0
        ?<div className="card" style={{textAlign:'center',padding:'2rem',color:'var(--m)'}}>— 0 pending —</div>
        :pend.map((r,i)=>(
          <div key={i} className="pc">
            <div style={{fontWeight:500,marginBottom:'.2rem'}}>{r.email}</div>
            <div style={{fontSize:'.76rem',color:'var(--m)',marginBottom:'.7rem'}}>{t.newDevice}: {r.device_id?.slice(0,20)}...</div>
            <div style={{display:'flex',gap:'.5rem'}}>
              <button className="btn bsm" style={{background:'var(--g)',color:'#000',border:'none'}} onClick={()=>dec(r.id,'approved')}>{t.approve}</button>
              <button className="btn bsm bdg" onClick={()=>dec(r.id,'rejected')}>{t.reject}</button>
            </div>
          </div>
        ))
      }
    </div>
  );
}

function App(){
  const[lang,setLang]=useState(localStorage.getItem('gl')||'es');
  const[user,setUser]=useState(null);const[profile,setProfile]=useState(null);const[gymData,setGymData]=useState(null);const[routine,setRoutine]=useState(null);const[tab,setTab]=useState('routine');const[loading,setLoading]=useState(true);
  const t=T[lang];
  const ADMIN=user?.email==='metra76@gmail.com';
  useEffect(()=>{localStorage.setItem('gl',lang);},[lang]);
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{if(session?.user)load(session.user);else setLoading(false);});
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>{if(s?.user)load(s.user);});
    return()=>subscription.unsubscribe();
  },[]);
  async function load(u){
    setUser(u);
    const[pr,gr,rr]=await Promise.all([
      sb.from('gymbro_profiles').select('*').eq('user_id',u.id).single(),
      sb.from('gymbro_gyms').select('*').eq('user_id',u.id).single(),
      sb.from('gymbro_routines').select('*').eq('user_id',u.id).order('created_at',{ascending:false}).limit(1).single()
    ]);
    if(pr.data){setProfile(pr.data);setLang(pr.data.lang||lang);}
    if(gr.data)setGymData(gr.data);
    if(rr.data)setRoutine(rr.data.routine);
    else{const c=localStorage.getItem('gr_'+u.id);if(c)setRoutine(JSON.parse(c));}
    setLoading(false);
  }
  async function logout(){await sb.auth.signOut();setUser(null);setProfile(null);setGymData(null);setRoutine(null);}
  if(loading)return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#0a0a0a',flexDirection:'column',gap:'1rem'}}>
      <div style={{fontFamily:'Bebas Neue',fontSize:'3.5rem',letterSpacing:'5px',color:'#00e676'}}>GYMBRO</div>
      <span className="sp"/>
    </div>
  );
  if(!user)return<Auth onAuth={load} lang={lang} setLang={setLang}/>;
  const init=(profile?.name||user.email||'U').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const nav=[
    {id:'routine',icon:'📋',label:t.routine},
    {id:'session',icon:'🏋️',label:t.session},
    {id:'history',icon:'📊',label:t.history},
    {id:'gym',icon:'🏟️',label:t.gym},
    {id:'profile',icon:'👤',label:t.profile},
    ...(ADMIN?[{id:'admin',icon:'🔑',label:t.admin}]:[])
  ];
  return(
    <div className="ml">
      <div className="tb">
        <div className="tl">GYMBRO</div>
        <div style={{display:'flex',alignItems:'center',gap:'.65rem'}}>
          <div className="lt">{['es','en'].map(l=><button key={l} className={`lb${lang===l?' active':''}`} onClick={()=>setLang(l)}>{l.toUpperCase()}</button>)}</div>
          <div className="av">{init}</div>
          <button style={{background:'none',border:'none',color:'var(--m)',cursor:'pointer',fontSize:'.78rem'}} onClick={logout}>{t.logout}</button>
        </div>
      </div>
      <div className="content">
        {tab==='routine'&&<Routine user={user} profile={profile} gymData={gymData} routine={routine} setRoutine={setRoutine} lang={lang} t={t}/>}
        {tab==='session'&&<Session user={user} routine={routine} lang={lang} t={t}/>}
        {tab==='history'&&<History user={user} lang={lang} t={t}/>}
        {tab==='gym'&&<Gym user={user} gymData={gymData} onSave={setGymData} lang={lang} t={t}/>}
        {tab==='profile'&&<Profile user={user} profile={profile} onSave={setProfile} lang={lang} t={t}/>}
        {tab==='admin'&&ADMIN&&<Admin user={user} t={t}/>}
      </div>
      <nav className="bn">
        {nav.map(item=>(
          <button key={item.id} className={`ni${tab===item.id?' active':''}`} onClick={()=>setTab(item.id)}>
            <span style={{fontSize:'1.2rem'}}>{item.icon}</span>
            <span>{item.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}
ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
